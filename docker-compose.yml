version: '3.8'

# =============================================================================
# ProjectXII Computer Vision - Full Docker Compose Configuration
# =============================================================================
# This configuration includes all services needed for production deployment:
# - FastAPI backend (with NVIDIA GPU support)
# - Celery worker for async video processing
# - PostgreSQL database
# - Redis for Celery message broker
# =============================================================================

services:
  # ===========================================================================
  # FastAPI Backend Service
  # ===========================================================================
  api:
    build: .
    container_name: projectxii-api
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_RELOAD=false
      - DEVICE=auto
      - YOLO_MODEL_NAME=${YOLO_MODEL_NAME:-best_yolov8x_Kiru.pt}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.5}
      - IOU_THRESHOLD=${IOU_THRESHOLD:-0.45}
    volumes:
      - .:/workspace
      - video_uploads:/workspace/data/uploads
    working_dir: /workspace
    ports:
      - "8000:8000"
    command: python3 -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ===========================================================================
  # Celery Worker for Async Video Processing
  # ===========================================================================
  celery:
    build: .
    container_name: projectxii-celery
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DEVICE=auto
      - YOLO_MODEL_NAME=${YOLO_MODEL_NAME:-best_yolov8x_Kiru.pt}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.5}
      - IOU_THRESHOLD=${IOU_THRESHOLD:-0.45}
    volumes:
      - .:/workspace
      - video_uploads:/workspace/data/uploads
    working_dir: /workspace
    command: celery -A src.celeryconfig worker --loglevel=info --concurrency=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================================================
  # React Frontend
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: projectxii-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  db:
    image: postgres:15-alpine
    container_name: projectxii-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=projectxii
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d projectxii" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # Redis (Celery Message Broker)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: projectxii-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# =============================================================================
# Named Volumes for Data Persistence
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  video_uploads:
    driver: local
