# =============================================================================
# Docker Compose for YOLOv8 Training Environment
# =============================================================================
# This compose file creates a GPU-enabled container for training YOLOv8 models.
# 
# Usage:
#   docker-compose -f docker/docker-compose.training.yml build
#   docker-compose -f docker/docker-compose.training.yml up
#
# Then open: http://localhost:8888
# =============================================================================

services:
  yolo-training:
    # -------------------------------------------------------------------------
    # Build Configuration
    # -------------------------------------------------------------------------
    build:
      context: ..
      dockerfile: docker/Dockerfile.training
    
    # -------------------------------------------------------------------------
    # Container Name
    # -------------------------------------------------------------------------
    container_name: yolo-training-gpu
    
    # -------------------------------------------------------------------------
    # GPU Configuration
    # -------------------------------------------------------------------------
    # This enables NVIDIA GPU access inside the container
    # Requires: NVIDIA Container Toolkit installed on host
    # -------------------------------------------------------------------------
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    # -------------------------------------------------------------------------
    # Environment Variables
    # -------------------------------------------------------------------------
    environment:
      # Make all NVIDIA GPUs visible to the container
      - NVIDIA_VISIBLE_DEVICES=all
      # Enable all driver capabilities (compute, graphics, utility, etc.)
      - NVIDIA_DRIVER_CAPABILITIES=all
    
    # -------------------------------------------------------------------------
    # Volume Mounts
    # -------------------------------------------------------------------------
    # Mount the project directory to /workspace in the container
    # This allows:
    # - Access to notebooks/ for running training
    # - Access to dataset_yolov8/ for the training data
    # - Access to models/ for saving trained weights
    # - Access to runs/ for training outputs and logs
    # -------------------------------------------------------------------------
    volumes:
      - ..:/workspace
    
    # -------------------------------------------------------------------------
    # Port Mapping
    # -------------------------------------------------------------------------
    # Map container port 8888 to host port 8888 for Jupyter access
    # -------------------------------------------------------------------------
    ports:
      - "8888:8888"
    
    # -------------------------------------------------------------------------
    # Working Directory
    # -------------------------------------------------------------------------
    working_dir: /workspace
    
    # -------------------------------------------------------------------------
    # Keep Container Running
    # -------------------------------------------------------------------------
    # stdin_open (docker run -i) and tty (docker run -t) keep the
    # container running and allow interactive terminal access
    # -------------------------------------------------------------------------
    stdin_open: true
    tty: true
    
    # -------------------------------------------------------------------------
    # Shared Memory Size
    # -------------------------------------------------------------------------
    # Increase shared memory for PyTorch DataLoader workers
    # Default is 64MB which can cause issues with num_workers > 0
    # 2GB should be sufficient for most training scenarios
    # -------------------------------------------------------------------------
    shm_size: '2gb'

# =============================================================================
# Network Configuration (Optional)
# =============================================================================
# Using default bridge network. Uncomment below to create custom network
# =============================================================================
# networks:
#   training-network:
#     driver: bridge
