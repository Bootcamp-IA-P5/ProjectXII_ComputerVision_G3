[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require DB/services)
    slow: Slow tests (video processing, model inference)

# Coverage settings
addopts = 
    -v
    --tb=short
    --strict-markers

# Ignore patterns
norecursedirs = 
    .git 
    __pycache__ 
    data 
    models 
    notebooks
    dataset_yolov8
